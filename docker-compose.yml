version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: melo_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: melo_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melo_backend
    ports:
      - '3000:3000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/melo}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - REFRESH_EXPIRES_IN=${REFRESH_EXPIRES_IN}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID}
      - JAMENDO_API_BASE=${JAMENDO_API_BASE:-https://api.jamendo.com/v3.0}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
